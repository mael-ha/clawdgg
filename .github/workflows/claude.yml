name: Claude Code

# Every run here spends the OWNER's Claude token, and the repo is public. The
# action's own check is "the actor has write access", which on a public repo is
# still a door — anyone can open an issue or comment — so each trigger path is
# gated twice on the owner instead: `author_association == 'OWNER'` (the owner
# wrote this comment/review/issue) AND `github.actor == github.repository_owner`
# (the owner's event started this run). Both hold only for mael-ha, because
# mael-ha/clawdgg is owned by a USER: GitHub never returns OWNER on an
# org-owned repo, and `repository_owner` would be the org's name there.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner && (
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    # Every scope is read. Claude's own writes — comments, branches — go through
    # the short-lived Claude GitHub App token the action mints for itself, not
    # through GITHUB_TOKEN. `id-token: write` is NOT spare: it is what mints
    # that token. The action's default GitHub App auth exchanges this job's OIDC
    # token for it, and without the scope every run fails on OIDC.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to a full commit SHA, like release-cli.yml: a tag is a moving
        # pointer the action's owner can repoint, and this job holds our token.
        # `@v1` resolves to this same commit today.
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # v1 has no `model:` input — the model is a Claude CLI flag.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md
          claude_args: "--model claude-opus-5-5"
