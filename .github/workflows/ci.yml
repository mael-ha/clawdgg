name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI reads the repo and nothing else. It runs `bun install` and a test suite on
# pull_request, which means it runs code from the branch.
permissions:
  contents: read

env:
  # The 24.3 line production runs. Bump both this and the compose image
  # together, or the tests stop describing the engine prod has.
  CLICKHOUSE_VERSION: "24.3.18.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full SHA: a tag is a pointer the action's owner can repoint.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The typecheck gate compares against the merge base, so it needs
          # more than a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.4"

      - run: bun install --frozen-lockfile

      # The ClickHouse-backed suites (docker/clickhouse/migrations) assert what
      # the DATABASE computes — that ClickHouse's row_id expression agrees with
      # the TypeScript hash, that the repair migration moves the rows it claims
      # to. Without a binary they SKIP, which is 20 tests that have never run
      # anywhere but a laptop. This is clickhouse-local: one static binary, no
      # server and no Docker.
      - name: Cache the ClickHouse binary
        id: clickhouse-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/clickhouse
          # The version is in the key, so a bump downloads instead of serving
          # the old binary from a warm cache.
          key: clickhouse-${{ env.CLICKHOUSE_VERSION }}-amd64

      - name: Download the ClickHouse binary
        if: steps.clickhouse-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/clickhouse
          # Pinned, and pinned to the 24.3 line production runs
          # (clickhouse/clickhouse-server:24.3-alpine): a test that passes
          # against a different engine than prod's proves less than it looks.
          url="https://github.com/ClickHouse/ClickHouse/releases/download/v${CLICKHOUSE_VERSION}-lts/clickhouse-common-static-${CLICKHOUSE_VERSION}-amd64.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o /tmp/clickhouse.tgz
          tar -xzf /tmp/clickhouse.tgz -C ~/.cache/clickhouse --strip-components=3 \
            "clickhouse-common-static-${CLICKHOUSE_VERSION}/usr/bin/clickhouse"
          rm -f /tmp/clickhouse.tgz
          chmod +x ~/.cache/clickhouse/clickhouse

      - name: Tests
        run: |
          set -euo pipefail
          # $HOME is not available to a step-level `env:`, so the path is built
          # here. A binary that cannot run is a failure, not a reason to skip:
          # silently skipping is the state this step exists to end.
          export CLICKHOUSE_BIN="$HOME/.cache/clickhouse/clickhouse"
          "$CLICKHOUSE_BIN" local --query 'SELECT version()'
          bun test

      # The repo carries pre-existing type errors, so a hard `tsc --noEmit`
      # gate would fail every run. This fails only when a change ADDS one:
      # errors are compared by file + message, ignoring line numbers, because
      # an unrelated edit above shifts them.
      - name: Typecheck (no new errors)
        run: |
          set -uo pipefail
          norm() { sed -E 's/\([0-9]+,[0-9]+\)//' | sort | uniq -c | sed -E 's/^ +//'; }
          errors() { (cd "$1" && bun x tsc --noEmit 2>&1) | grep 'error TS' | norm; }

          errors . > after.txt || true

          # The baseline is checked out into a scratch directory rather than by
          # stashing, so the working tree under test is never disturbed.
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          BASELINE_DIR=$(mktemp -d)
          git archive "$BASE" | tar -x -C "$BASELINE_DIR"
          ln -s "$PWD/node_modules" "$BASELINE_DIR/node_modules"
          errors "$BASELINE_DIR" > before.txt || true

          echo "baseline ($BASE): $(wc -l < before.txt) distinct  |  after: $(wc -l < after.txt) distinct"
          if ! NEW=$(diff before.txt after.txt | grep '^>'); then
            echo "No new type errors."
            exit 0
          fi
          echo "::error::New TypeScript errors introduced:"
          echo "$NEW"
          exit 1

      # The SQLite chain must replay into the schema src/db/schema.ts
      # describes. It did not for ten months — a journal naming a file that had
      # been renamed, two hand-written migrations with no breakpoint markers,
      # three columns in a file no journal entry pointed at — and no test could
      # see any of it, because the app and the tests run against a database
      # that was migrated by other means.
      - name: Migrations replay from zero
        run: bun scripts/check-migrations.ts

      # The app's own build. A page that renders without its stylesheet is a
      # broken deploy, and the manifest is what every template resolves its
      # asset URLs through — so its absence is the failure to catch here.
      - name: Build the web assets
        run: |
          set -eu
          bun run build
          test -f public/build/manifest.json || {
            echo "::error::bun run build did not produce public/build/manifest.json"
            exit 1
          }
          echo "manifest:"
          cat public/build/manifest.json

      - name: Compile the CLI binary for this host
        run: bun scripts/build-cli.ts

      # A compiled binary that can't print its own version means the bundle is
      # broken in a way `bun test` cannot see (missing module, bad --define,
      # something that only resolves from the source tree).
      - name: CLI smoke test
        run: |
          set -eu
          BIN="dist/cli/clawdgg-linux-$( [ "$(uname -m)" = aarch64 ] && echo arm64 || echo x64 )"
          FIXTURE_HOME=$(mktemp -d)

          test "$("$BIN" version)" = "clawdgg v$(bun -e 'console.log(require("./cli/package.json").version)')"
          "$BIN" help | grep -q 'clawdgg setup'

          # No token in the fixture home: the headers helper must FAIL, because
          # a helper that exits 0 with no credential is the silent token cliff.
          if HOME="$FIXTURE_HOME" "$BIN" otel-headers; then
            echo "::error::otel-headers exited 0 without a token"
            exit 1
          fi

          # doctor is read-only and exits non-zero when nothing is configured.
          HOME="$FIXTURE_HOME" "$BIN" doctor || true
          test ! -e "$FIXTURE_HOME/.claude/settings.json"
          test ! -e "$FIXTURE_HOME/.config/clawdgg"
          echo "doctor left the fixture home untouched."

      # The installer is the one file every user executes, and a syntax error
      # in it is a broken `curl | sh` for everyone.
      - name: Check install.sh
        run: |
          set -eu
          sh -n scripts/install.sh
          # Everything must be inside main(), so a truncated download of the
          # script cannot execute a half-read function body.
          grep -q '^main "\$@"$' scripts/install.sh
          # TLS is pinned on the real download path.
          grep -q "curl --proto '=https' --tlsv1.2" scripts/install.sh

      - name: Package the CLI for bunx
        run: |
          set -eu
          cd cli
          npm pack --dry-run 2>&1 | tee pack.txt
          # Nothing but the bundle, the readme and the manifest may ship. Any
          # .ts at all is source: naming the files individually meant every
          # new module had to be remembered here, and two were not.
          if grep -qE '^npm notice .*\.ts([[:space:]]|$)' pack.txt; then
            echo "::error::npm package contains CLI source it should not publish"
            exit 1
          fi
          if grep -qE '^npm notice .*(tsconfig|checksums/)' pack.txt; then
            echo "::error::npm package contains files it should not publish"
            exit 1
          fi
