name: Release CLI

# Tag `cli-v<version>` to publish. The tag's version must match
# cli/package.json, and install.sh derives the asset URL from the same tag:
#
#   git tag cli-v2.0.0 && git push origin cli-v2.0.0
#
# The checksums are NOT the security boundary of this workflow — they are
# committed to cli/checksums/<version>.txt and served by clawd.gg, so taking
# this workflow (or the release) is not enough to make anyone install a swapped
# binary. See cli/checksums/README.md for the release order.
#
# This workflow does NOT publish to npm. `bunx clawdgg` is published by hand
# from cli/ (`npm publish`) once the binaries are out.
#
# Every action is pinned to a full commit SHA. A tag is a moving pointer the
# action's owner can repoint, and these jobs handle the artifacts people
# `curl | sh` onto their machines.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing cli-v* tag to build"
        required: true

# Default for every job: read. The one job that needs to write says so itself.
permissions:
  contents: read

jobs:
  # ── Build ────────────────────────────────────────────────────────────────
  # No write permission and no credentials in the checkout: this job runs
  # `bun install` and compiles, which is where third-party code executes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Leave no GITHUB_TOKEN in .git/config for anything this job runs.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.4"

      # --ignore-scripts: a dependency's postinstall must not run in the job
      # that produces the binaries people download.
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the tag matches cli/package.json
        id: version
        # The tag goes through env, never interpolated into the script body:
        # `${{ }}` inside `run:` is textual substitution, and a tag is a name
        # someone chose.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          TAG_VERSION="${TAG#cli-v}"
          PKG_VERSION=$(bun -e 'console.log(require("./cli/package.json").version)')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG says $TAG_VERSION but cli/package.json says $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - run: bun test

      # All eight targets cross-compile from this one Linux runner.
      - name: Build binaries + checksums
        run: bun scripts/build-cli.ts --all --checksums

      - name: Verify every asset is present and the checksums match
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          cd dist/cli
          for target in \
            darwin-arm64 darwin-x64 \
            linux-x64 linux-x64-baseline linux-x64-musl linux-x64-musl-baseline \
            linux-arm64 linux-arm64-musl
          do
            test -f "clawdgg-$target" || { echo "::error::missing clawdgg-$target"; exit 1; }
          done
          sha256sum -c checksums.txt
          # The native binary must run, and print the version the tag claims.
          test "$(./clawdgg-linux-x64 version)" = "clawdgg v$VERSION"
          ls -lh

      # The committed copy has to be byte-identical to what we just built, or
      # clawd.gg would serve a hash for a binary nobody can get.
      - name: Show the checksums to commit
        run: |
          set -eu
          echo "Commit this as cli/checksums/${{ steps.version.outputs.version }}.txt:"
          cat dist/cli/checksums.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-binaries
          path: dist/cli/
          if-no-files-found: error
          retention-days: 7

  # ── Publish ──────────────────────────────────────────────────────────────
  # The only job with write access, and it runs no third-party code: it
  # downloads what `build` produced, attests it, and uploads it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attest-build-provenance signs with the job's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-binaries
          path: dist/cli

      # Signed, verifiable provenance for each binary: which workflow, which
      # commit, which runner built it. `gh attestation verify` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cli/clawdgg-*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          # No --clobber. Replacing an asset on a published release would swap a
          # binary under everyone who already has the URL; a re-run that wants
          # to do that has to be a new version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/cli/*
          else
            gh release create "$TAG" dist/cli/* \
              --title "clawdgg v$VERSION" \
              --notes "Install: \`curl -fsSL https://clawd.gg/install | sh\`

          The installer verifies every download against the checksums clawd.gg
          serves at https://clawd.gg/install/checksums/$VERSION.txt — not against
          this release — so a swapped asset here cannot be installed.

          Verify a download yourself:
          \`\`\`
          curl -fsSLO https://clawd.gg/install/checksums/$VERSION.txt
          shasum -a 256 -c $VERSION.txt --ignore-missing
          gh attestation verify clawdgg-<target> --repo $GH_REPO
          \`\`\`"
          fi
