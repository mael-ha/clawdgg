# Development compose - just ClickHouse for local development
# Run with: docker compose -f docker-compose.dev.yml up -d
#
# Then run the app with: bun run dev

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clawd-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      - CLICKHOUSE_DB=clawd
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clickhouse_dev_data:
